{% extends "base_public.html" %}
{% block title %}Log in &mdash; SkillSwap{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Log in</h2>
  <form method="POST">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required data-password-toggle>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="small mt-5 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
